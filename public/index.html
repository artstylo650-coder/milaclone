<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Milaclone</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#101116">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  // lets the browser offer "Instalar Milaclone" as an app (see public/sw.js)
  if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
</script>
<!-- fonts are served from node_modules (offline-friendly); only the files a
     font pair uses are downloaded -->
<link rel="stylesheet" href="/vendor/fonts/figtree/index.css">
<link rel="stylesheet" href="/vendor/fonts/fraunces/index.css">
<link rel="stylesheet" href="/vendor/fonts/inter/index.css">
<link rel="stylesheet" href="/vendor/fonts/source-serif-4/index.css">
<link rel="stylesheet" href="/vendor/fonts/dm-sans/index.css">
<link rel="stylesheet" href="/vendor/fonts/nunito/index.css">
<script>
  // apply the saved theme before first paint (see js/ui/theme.js)
  (function () {
    try {
      var t = localStorage.getItem('theme') || 'auto', f = localStorage.getItem('fontPair') || 'classic';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.font = f;
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="topbar">
  <nav id="crumbs"></nav>
  <div class="top-right">
    <button type="button" class="top-phone" id="phoneNotes" aria-label="Do seu celular" aria-expanded="false" aria-haspopup="dialog" title="Notas rápidas do celular">
      <i data-lucide="smartphone"></i>
      <span class="top-phone-badge" id="phoneNotesBadge" hidden>0</span>
    </button>
    <button type="button" class="top-filter" id="filterBtn" title="Mostrar só cards com uma tag ou cor"><i data-lucide="filter"></i><span>Filtrar</span></button>
    <button type="button" class="top-search" id="searchBtn" title="Buscar em todos os boards (Ctrl+K)"><i data-lucide="search"></i><span>Buscar</span><kbd>Ctrl K</kbd></button>
    <span class="ghost" title="As alterações são salvas automaticamente">Salvo</span>
    <div class="zoomwrap histwrap">
      <button type="button" id="undoBtn" title="Desfazer (Ctrl+Z)" aria-label="Desfazer" disabled><i data-lucide="undo-2"></i></button>
      <button type="button" id="redoBtn" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer" disabled><i data-lucide="redo-2"></i></button>
    </div>
    <div class="zoomwrap">
      <button id="zoomOut" title="Diminuir zoom">−</button>
      <span class="lvl" id="zoomLvl">100%</span>
      <button id="zoomIn" title="Aumentar zoom">+</button>
      <button id="zoomReset" title="Ajustar o board à tela (F)" aria-label="Ajustar à tela">⤢</button>
    </div>
    <button type="button" class="top-icon" id="appMenuBtn" title="Mais opções" aria-label="Mais opções"><i data-lucide="ellipsis"></i></button>
  </div>
</div>

<aside id="rail">
  <div id="railCreate">
  <button class="tool" data-tool="note" title="Nota (N)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5h14M5 10h14M5 15h9" stroke-linecap="round"/></svg>
    Nota
  </button>
  <button class="tool" data-tool="link" title="Link (L)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.5 14.5l5-5M8 13l-2 2a3 3 0 104.2 4.2l2-2M16 11l2-2a3 3 0 10-4.2-4.2l-2 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Link
  </button>
  <button class="tool" data-tool="todo" title="Lista de tarefas (T)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6.5l1.6 1.6L8.5 5M4 13l1.6 1.6L8.5 11M4 19.5l1.6 1.6L8.5 18M12 6.5h8M12 13h8M12 19.5h8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Tarefas
  </button>
  <button class="tool" data-tool="board" title="Board (B)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>
    Board
  </button>
  <button class="tool" data-tool="column" title="Coluna (C)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1.5"/><rect x="5" y="11" width="14" height="5" rx="1.5"/><rect x="5" y="18" width="14" height="2.5" rx="1.2"/></svg>
    Coluna
  </button>
  <button class="tool" data-tool="comment" title="Comentário (M)">
    <i data-lucide="message-circle"></i>
    Comentário
  </button>
  <button class="tool" data-tool="comfy" title="Node ComfyUI: gera imagens a partir de um prompt e das fotos ligadas">
    <i data-lucide="sparkles"></i>
    ComfyUI
  </button>
  <div class="rail-sep"></div>
  <button class="tool" data-tool="image" title="Importar fotos. Selecione um grupo antes para colocá-las nele.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4.5L13 16l3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Fotos
  </button>
  <button class="tool" data-tool="upload" title="Enviar arquivo">
    <i data-lucide="upload"></i>
    Arquivo
  </button>
  </div>
  <div id="railBoard" hidden>
    <button type="button" class="tool" id="railBoardBack" title="Concluir">
      <i data-lucide="chevron-left"></i>
    </button>
    <div class="rail-sep"></div>
    <button type="button" class="tool" id="railBoardColor" title="Cor">
      <span class="rail-swatch" id="railBoardSwatch"></span>
      Cor
    </button>
    <button type="button" class="tool" id="railBoardIcon" title="Ícone">
      <span class="rail-icon" id="railBoardIconGlyph"></span>
      Ícone
    </button>
    <button type="button" class="tool" id="railBoardRename" title="Renomear">
      <i data-lucide="type"></i>
      Renomear
    </button>
    <button type="button" class="tool" id="railBoardDelete" title="Excluir">
      <i data-lucide="trash-2"></i>
      Excluir
    </button>
  </div>
</aside>

<div id="stage">
  <div id="world"></div>
  <div id="selectionBox" hidden></div>
</div>
<canvas id="minimap" width="200" height="130" title="Visão geral do board — clique para ir até lá" aria-label="Visão geral do board"></canvas>

<div id="multiActions" hidden>
  <span id="multiCount"></span>
  <button type="button" id="multiAlign" title="Alinhar, distribuir ou organizar os cards selecionados">Alinhar ▾</button>
  <button type="button" id="multiEnhance" title="Aprimorar (upscale) as imagens selecionadas" hidden>Aprimorar</button>
  <button type="button" id="multiGroup" title="Manter as referências juntas e movê-las como um grupo">Agrupar</button>
  <button type="button" id="multiUngroup" title="Remover a moldura do grupo e manter os cards">Desagrupar</button>
  <button type="button" id="multiDelete" class="danger">Excluir</button>
</div>

<div id="hint">
  <h2>Este board está vazio</h2>
  <p class="hint-desktop">Escolha uma ferramenta à esquerda e clique no canvas — ou dê um duplo clique em qualquer lugar.</p>
  <p class="hint-mobile">Toque em +, escolha uma ferramenta e toque no canvas.</p>
</div>

<header id="mheader" hidden>
  <button class="mh-btn" id="mBack" aria-label="Voltar"><i data-lucide="chevron-left"></i></button>
  <h1 id="mTitle"></h1>
  <button class="mh-btn mh-round" id="mShare" aria-label="Copiar link do board"><i data-lucide="user-plus"></i></button>
</header>

<nav id="mfooter">
  <div class="mf-row" id="mfNav">
    <button class="mf-icon" id="mMore" aria-label="Mais opções"><i data-lucide="ellipsis"></i></button>
    <div class="mf-tabs">
      <button class="mf-tab active" id="mBoards">Seus boards</button>
      <button class="mf-tab" id="mNotes">Notas rápidas</button>
    </div>
    <button class="mf-icon" id="mAdd" aria-label="Adicionar card"><i data-lucide="plus"></i></button>
  </div>
  <div class="mf-row mf-tray" id="mfTray" hidden>
    <button class="mf-icon mf-close" id="mTrayClose" aria-label="Fechar ferramentas"><i data-lucide="x"></i></button>
    <div class="mf-tools" id="mfTools"></div>
  </div>
  <div class="mf-row" id="mfBoard" hidden>
    <div class="mf-board-actions">
      <button type="button" class="mf-bact" id="mfBoardColor">
        <span class="mf-bact-swatch" id="mfBoardSwatch"></span>
        <span>Cor</span>
      </button>
      <button type="button" class="mf-bact" id="mfBoardIcon">
        <span class="mf-bact-icon" id="mfBoardIconGlyph"></span>
        <span>Ícone</span>
      </button>
      <button type="button" class="mf-bact" id="mfBoardRename">
        <span class="mf-bact-glyph"><i data-lucide="type"></i></span>
        <span>Renomear</span>
      </button>
      <button type="button" class="mf-bact" id="mfBoardMore">
        <span class="mf-bact-glyph"><i data-lucide="ellipsis"></i></span>
        <span>Mais</span>
      </button>
    </div>
    <button type="button" class="mf-done" id="mfBoardDone">Concluir</button>
  </div>
</nav>

<!-- Quick notes: task workspace (mobile fullscreen / desktop phone popover).
     Three-level stack (overview → list → task) plus a modal search layer.
     Static chrome lives here; quicknotes.js fills every [id] region. -->
<div id="quicknotes" hidden>
  <div class="qn-deskhead" id="qnDeskHead" hidden>Do seu celular</div>

  <section class="qn-screen" id="qnHome">
    <div class="qn-scroll qn-home-scroll">
      <div class="qn-titlerow">
        <h1 class="qn-title">Notas rápidas</h1>
        <button class="qn-round" id="qnSearchBtn" aria-label="Buscar tarefas"><i data-lucide="search"></i></button>
        <button class="qn-round" id="qnHomeMenu" aria-label="Opções das notas rápidas"><i data-lucide="ellipsis"></i></button>
      </div>
      <div class="qn-tiles" id="qnTiles"></div>
      <div class="qn-chips" id="qnHomeChips"></div>
      <div class="qn-section">
        <h2 class="qn-h2">Listas</h2>
        <div class="qn-card qn-rows" id="qnLists"></div>
      </div>
    </div>
    <div class="qn-bar">
      <button class="qn-bar-icon" id="qnBarMenu" aria-label="Opções das notas rápidas"><i data-lucide="ellipsis"></i></button>
      <div class="qn-bar-tabs">
        <button class="qn-bar-tab" id="qnBoards">Seus boards</button>
        <span class="qn-bar-tab active">Notas rápidas</span>
      </div>
      <button class="qn-bar-icon" id="qnAdd" aria-label="Adicionar"><i data-lucide="plus"></i></button>
    </div>
  </section>

  <section class="qn-screen" id="qnList">
    <div class="qn-navrow">
      <button class="qn-back" id="qnListBack"><i data-lucide="chevron-left"></i><span>Notas rápidas</span></button>
      <button class="qn-dots" id="qnListMenu" aria-label="Opções da lista"><i data-lucide="ellipsis"></i></button>
    </div>
    <div class="qn-scroll qn-list-scroll">
      <div class="qn-listhead">
        <div class="qn-listtitle" id="qnListTitle"></div>
        <div class="qn-listmeta" id="qnListMeta"></div>
      </div>
      <div class="qn-tasks" id="qnTasks"></div>
    </div>
    <div class="qn-addbar" id="qnAddBar" hidden>
      <button class="qn-addbtn" id="qnAddTask"><i data-lucide="plus"></i><span>Adicionar tarefa</span></button>
      <div class="qn-addfield" id="qnAddField" hidden>
        <span class="qn-box"></span>
        <input id="qnNewTask" placeholder="Nova tarefa — Enter para salvar" aria-label="Nova tarefa">
        <button class="qn-x" id="qnAddCancel" aria-label="Cancelar"><i data-lucide="x"></i></button>
      </div>
    </div>
  </section>

  <section class="qn-screen" id="qnTask">
    <div class="qn-navrow">
      <button class="qn-back" id="qnTaskBack"><i data-lucide="chevron-left"></i><span id="qnTaskBackLabel"></span></button>
    </div>
    <div class="qn-scroll qn-task-scroll">
      <div class="qn-taskhead">
        <button class="qn-box qn-box-lg" id="qnTaskBox" aria-label="Marcar como feita"><i data-lucide="check"></i></button>
        <h2 class="qn-tasktitle" id="qnTaskTitle" contenteditable="true" role="textbox" aria-label="Tarefa"></h2>
        <button class="qn-star qn-star-lg" id="qnTaskStar" aria-label="Favoritar tarefa"><i data-lucide="star"></i></button>
      </div>
      <div class="qn-card qn-details" id="qnDetails"></div>
      <div class="qn-card qn-notecard">
        <div class="qn-noterow">
          <span class="qn-notelabel">NOTA</span>
          <div class="qn-fmt" id="qnFmt"></div>
        </div>
        <textarea id="qnNote" rows="4" placeholder="Adicionar nota" aria-label="Nota"></textarea>
      </div>
    </div>
    <div class="qn-taskfoot">
      <span class="qn-foot-pad"></span>
      <span class="qn-created" id="qnCreated"></span>
      <button class="qn-trash" id="qnDelTask" aria-label="Excluir tarefa"><i data-lucide="trash-2"></i></button>
    </div>
  </section>

  <section class="qn-screen qn-searchscreen" id="qnSearch">
    <div class="qn-searchbar">
      <div class="qn-searchfield">
        <i data-lucide="search"></i>
        <input id="qnQuery" placeholder="Buscar tarefas, notas, tags" aria-label="Buscar tarefas">
        <button class="qn-x" id="qnQueryClear" aria-label="Limpar busca" hidden><i data-lucide="x"></i></button>
      </div>
      <button class="qn-cancel" id="qnSearchCancel">Cancelar</button>
    </div>
    <div class="qn-chips qn-chips-scroll" id="qnSearchChips"></div>
    <div class="qn-scroll qn-results" id="qnResults"></div>
  </section>

  <div class="qn-dim" id="qnDim"></div>
  <div class="qn-sheet" id="qnSheet">
    <div class="qn-grabber"></div>
    <div id="qnSheetBody"></div>
  </div>
</div>

<div id="msheet" hidden>
  <button data-act="undo">Desfazer</button>
  <button data-act="redo">Refazer</button>
  <button data-act="zoomin">Aumentar zoom</button>
  <button data-act="zoomout">Diminuir zoom</button>
  <button data-act="reset">Ajustar à tela</button>
  <button data-act="trash">Lixeira</button>
  <button data-act="backup">Baixar backup</button>
</div>

<div id="mBoardSheet" hidden>
  <button data-act="delete" class="danger">Mover para a lixeira</button>
</div>

<div id="palette"></div>
<div id="ctxmenu" role="menu"></div>
<input type="file" id="fileInput" accept="image/*" multiple>
<input type="file" id="uploadInput" accept=".pdf,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.json,text/*,application/pdf" multiple>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/lucide@0.469.0"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
